[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "axera"
version = "0.1.0"
description = "Polynomial neural networks and multi-objective optimisation for underdetermined biomedical datasets"
authors = [
    { name = "Farzad Ziaie Nezhad", email = "farzadziaien@gmail.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = [
    "machine-learning",
    "biomedical",
    "neural-network",
    "GMDH",
    "LIP",
    "Bland-Altman",
    "ICC",
    "multi-objective",
    "MOPSO",
    "clinical",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13",
    "tqdm>=4.66",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4",
    "torchvision>=0.19",
]
server = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "pytest-benchmark>=4.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.108",
    "mutmut>=2.4",
    "ruff>=0.5",
    "black>=24",
    "isort>=5.13",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "maturin>=1.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
]

[project.urls]
Homepage       = "https://github.com/farzad-ziaie/axera"
Documentation  = "https://farzad-ziaie.github.io/axera"
Repository     = "https://github.com/farzad-ziaie/axera"
"Bug Tracker"  = "https://github.com/farzad-ziaie/axera/issues"
Changelog      = "https://github.com/farzad-ziaie/axera/blob/main/CHANGELOG.md"

[project.scripts]
axera = "axera.cli:app"

# ── Maturin (Rust extension) ──────────────────────────────────────────────────
[tool.maturin]
features      = ["pyo3/extension-module"]
module-name   = "axera._core"
python-source = "."
manifest-path = "axera_core/Cargo.toml"

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length    = 120
src            = ["axera"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT"]
ignore = ["ANN101", "ANN102", "ANN003", "ANN401", "B008", "S101", "N801", "N802", "N803", "N804", "N805", "N806", "E902"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"examples/**" = ["ANN", "S"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length    = 100
target-version = ["py312"]

# ── isort ────────────────────────────────────────────────────────────────────
[tool.isort]
profile                = "black"
line_length            = 100
known_first_party      = ["axera"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = true
plugins                = ["pydantic.mypy"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths      = ["tests"]
asyncio_mode   = "auto"
addopts        = "--cov=axera --cov-report=term-missing --cov-fail-under=75 -v"

[tool.coverage.run]
source   = ["axera"]
omit     = ["axera/cli.py", "axera/telemetry.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
