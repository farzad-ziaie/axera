name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint & format ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install ruff black isort
      - run: ruff check axera tests
      - run: black --check axera tests
      - run: isort --check-only axera tests

  # ── Type check ─────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install (CPU-only)
        run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: mypy axera --ignore-missing-imports

  # ── Tests (matrix) ────────────────────────────────────────────────────────
  test:
    name: "Tests — ${{ matrix.os }} / torch ${{ matrix.torch }}"
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        torch: ["2.4.0", "2.5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install (CPU torch)
        run: |
          pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -x --cov=axera --cov-report=xml --no-header -q

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── NumPy-only (no torch) ──────────────────────────────────────────────────
  test-numpy-backend:
    name: NumPy-only backend
    needs: lint
    runs-on: ubuntu-latest
    env:
      AXERA_BACKEND: numpy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install -e ".[dev]" --no-deps
      - run: pip install numpy scipy scikit-learn pydantic pydantic-settings typer rich tqdm pandas pytest pytest-cov
      - name: Run numpy-safe tests
        run: pytest tests/test_medical.py tests/test_config.py tests/test_hooks.py -v

  # ── Security ──────────────────────────────────────────────────────────────
  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install bandit
      - run: bandit -r axera -ll

  # ── Build wheel ───────────────────────────────────────────────────────────
  build:
    name: Build wheel (pure Python)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install build maturin
      # Build pure-Python fallback wheel (no Rust)
      - run: python -m build --wheel --outdir dist/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/
